name: Publish Wedding Invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check application JavaScript
        run: node --check app.js
      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html style.css app.js pdf-lib.min.js pdf-lib-LICENSE.txt first-page.png invitation.pdf .nojekyll _site/
          cp -R fonts _site/fonts
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
